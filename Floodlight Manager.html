<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070d16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="claude:viewport-fit-sides" content="cover"><title>Floodlight Manager</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* Layout concept: a phone-first club office. Sticky club bar on top, five-tab bottom nav, bottom sheets for every decision, full-screen match centre for live games. */
:root{
  --bg:#070d16;--surface:#0f1a2d;--surface2:#16253f;--line:#233350;
  --text:#e8eef8;--muted:#92a0ba;--dim:#8a97b0;
  --accent:#2fd27e;--accent-ink:#04150c;--gold:#f2c14e;--red:#ff5c6c;--blue:#4d8dff;--amber:#ff9b3d;
  --f-disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;color-scheme:dark;
  --shadow-1:0 1px 0 rgba(255,255,255,.04),0 8px 22px -18px rgba(0,0,0,.7);
  --shadow-2:0 18px 48px -20px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.05);
  --sh-inset:inset 0 1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 50% -90px,rgba(47,210,126,.11),transparent 70%),radial-gradient(520px 380px at 105% 28%,rgba(77,141,255,.08),transparent 70%);
  background-attachment:fixed;color:var(--text);font:400 15px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden;touch-action:manipulation;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:80}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;padding-bottom:calc(106px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}.dim{color:var(--dim)}.gold{color:var(--gold)}.green{color:var(--accent)}.red{color:var(--red)}.blue{color:var(--blue)}.amber{color:var(--amber)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:10px}
.sp{height:10px}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-disp)}
.tc{text-align:center}.tr{text-align:right}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:10px 0 14px;display:flex;align-items:center;gap:10px}
.top::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:100vw;height:100%;background:linear-gradient(var(--bg) 80%,rgba(7,13,22,0));z-index:-1;pointer-events:none}
.tname{font:700 21px/1 var(--f-disp);letter-spacing:.3px;text-transform:uppercase}
.tsub{font-size:12px;color:var(--muted);margin-top:2px}
.bal{margin-left:auto;text-align:right;flex:none}
.bal b{font:700 19px/1 var(--f-disp);color:var(--gold)}
.bal span{display:block;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);margin-top:2px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(8,14,25,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -14px 34px -14px rgba(0,0,0,.75)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nb{position:relative;background:none;border:0;color:var(--dim);padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px var(--f-body);letter-spacing:.5px;text-transform:uppercase;min-height:52px}
.nb svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.nb.on{color:var(--accent)}.nb.on svg{transform:translateY(-2px) scale(1.1)}
.nb.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--accent);border-radius:0 0 3px 3px;animation:grow .3s ease-out}
.badge{position:absolute;top:4px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 10.5px/17px var(--f-body);text-align:center;padding:0 4px}
.nav{touch-action:pan-x}
.nav-grab{display:flex;justify-content:center;padding:2px 0 3px;cursor:pointer;background:none;border:0;width:100%}
.nav-grab span{width:40px;height:4px;border-radius:3px;background:var(--line);transition:background .2s}
.nav.open .nav-grab span{background:var(--accent)}
.nav-extra{max-height:0;overflow:hidden;opacity:0;max-width:560px;margin:0 auto;transition:max-height .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.nav.open .nav-extra{max-height:380px;opacity:1}
.navx-row{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:2px 0 6px}
.navx-row.three{grid-template-columns:repeat(3,1fr)}
.navx-row.four{grid-template-columns:repeat(4,1fr)}
.navx-row.six{grid-template-columns:repeat(6,1fr)}
.loadpage{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(24px + env(safe-area-inset-bottom,0px))}
.slotcard{border:1px dashed var(--line);border-radius:22px;padding:16px;background:transparent}
.slotcard.full{border-style:solid;background:var(--surface);box-shadow:var(--shadow-1)}
.slotplus{width:56px;height:56px;border-radius:50%;border:1px dashed var(--line);display:grid;place-items:center;flex:none;font:700 24px var(--f-disp);color:var(--muted)}
.slotname{font:800 22px var(--f-disp);text-transform:uppercase;letter-spacing:.3px;line-height:1.05}
.loadpage .h1{font-size:30px}
.navx{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;background:none;border:0;color:var(--dim);font:600 10px var(--f-body);letter-spacing:.4px;text-transform:uppercase;min-height:52px;transition:color .2s,transform .15s}
.navx svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.navx:active{transform:scale(.96)}
.navx:active svg,.navx.ncal svg,.navx.nfin svg,.navx.nsave svg,.navx.nlgn svg{transform:translateY(-1px);color:var(--accent)}
.navx.ncal,.navx.nfin,.navx.nsave,.navx.nlgn{color:var(--accent)}
.navx.ncal::before,.navx.nfin::before,.navx.nsave::before,.navx.nlgn::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--accent);border-radius:0 0 3px 3px}
.nav-back{position:fixed;inset:0;z-index:29;background:rgba(2,6,12,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.nav-back.on{opacity:1;pointer-events:auto}

/* view */
.view.enter{animation:rise .38s cubic-bezier(.2,.8,.2,1)}
.stag>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
.stag>*:nth-child(2){animation-delay:.05s}.stag>*:nth-child(3){animation-delay:.1s}.stag>*:nth-child(4){animation-delay:.15s}.stag>*:nth-child(5){animation-delay:.2s}.stag>*:nth-child(6){animation-delay:.25s}.stag>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes slotIn{0%{opacity:0;transform:translate(-50%,-50%) translateY(22px) scale(.68);filter:blur(2px)}55%{opacity:1;transform:translate(-50%,-50%) translateY(-5px) scale(1.08);filter:blur(0)}78%{transform:translate(-50%,-50%) translateY(1px) scale(.98)}100%{opacity:1;transform:translate(-50%,-50%) translateY(0) scale(1)}}
@keyframes nameIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,210,126,.5)}100%{box-shadow:0 0 0 14px rgba(47,210,126,0)}}
@keyframes goal{0%{transform:scale(1)}30%{transform:scale(1.35);color:var(--gold)}100%{transform:scale(1)}}
@keyframes beam{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes feedin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow-1);transition:border-color .2s,box-shadow .2s}
.card.flat{padding:0;overflow:hidden}
.h2{font:600 13px var(--f-disp);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.h2 .more{margin-left:auto;color:var(--accent);letter-spacing:.8px;background:none;border:0;font:600 12px var(--f-disp);text-transform:uppercase}
.h1{font:800 30px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.3px;margin:0}
.big{font:700 34px/1 var(--f-disp)}
.lbl{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#1a2c49,#12203a);color:var(--text);font:700 16px var(--f-disp);letter-spacing:.8px;text-transform:uppercase;transition:transform .12s,background .2s,opacity .2s;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1d00;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.btn.dng{background:rgba(255,92,108,.14);border-color:rgba(255,92,108,.5);color:var(--red);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn:focus-visible,.nb:focus-visible,.seg button:focus-visible,.chip:focus-visible,.prow:focus-visible,.x:focus-visible,.cc:focus-visible,.opt:focus-visible,.slot:focus-visible,.ibadge:focus-visible,.pbtn:focus-visible,.zone:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;padding:0 14px;flex:1 0 auto;border:1px solid var(--line);background:linear-gradient(180deg,#1a2c49,#12203a);color:var(--muted);min-height:44px;border-radius:12px;font:700 14px var(--f-disp);letter-spacing:.8px;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:background .2s,color .2s,border-color .2s,transform .12s}
.seg button:active{transform:scale(.97)}
.seg button.on{color:var(--accent);border-color:var(--accent);background:linear-gradient(180deg,rgba(47,210,126,.14),rgba(47,210,126,.04))}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.sh .chips{flex-wrap:wrap;overflow:visible}
.pager{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.pgbtn{width:44px;min-height:44px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#1a2c49,#12203a);color:var(--text);font:800 26px var(--f-disp);line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .12s,border-color .2s}
.pgbtn:active{transform:scale(.95)}
.pgbtn:disabled{opacity:.35}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;min-height:44px;padding:0 13px;font:600 13px var(--f-body)}
.chip.on{background:rgba(47,210,126,.14);border-color:var(--accent);color:var(--accent)}
.pickbtn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#1a2c49,#12203a);color:var(--text);font:700 14px var(--f-disp);letter-spacing:.7px;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);white-space:nowrap;transition:transform .12s,border-color .2s}
.pickbtn:active{transform:scale(.97)}
.pickbtn b{font:700 14px var(--f-disp);color:var(--accent);letter-spacing:.7px}
.compbtn{width:100%;justify-content:flex-start;gap:10px;min-height:50px;font-size:15px;padding:0 14px}
.compbtn .compflag{font-size:19px;line-height:1;flex:none}
.compbtn svg{margin-left:auto}
.pickbtn svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font:600 16px var(--f-body)}
.pickrow:last-child{border-bottom:0}
.pickrow:active{background:var(--surface2)}
.pickrow .ck{margin-left:auto;color:var(--accent);font:700 16px var(--f-body)}
.pickrow.on{color:var(--accent)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font:700 11px/16px var(--f-body);letter-spacing:.5px;text-transform:uppercase;background:var(--surface2);color:var(--muted)}
.pill.g{background:rgba(47,210,126,.15);color:var(--accent)}.pill.r{background:rgba(255,92,108,.15);color:var(--red)}.pill.y{background:rgba(242,193,78,.16);color:var(--gold)}.pill.b{background:rgba(77,141,255,.16);color:var(--blue)}
input[type=text],input[type=search],select,textarea{width:100%;min-height:46px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;color:var(--text);outline:none}
textarea{padding:10px 12px;min-height:110px;font-size:16px}
input[type=text]:focus,input[type=search]:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 14px) 20px;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
input[type=range]{width:100%;accent-color:var(--accent);height:34px;margin:0}
.bar{height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.g>i{background-color:var(--gold)}.bar.r>i{background-color:var(--red)}.bar.b>i{background-color:var(--blue)}.bar.a>i{background-color:var(--amber)}

/* player bits */
.ovr{display:inline-grid;place-items:center;min-width:36px;height:28px;border-radius:8px;font:800 17px var(--f-disp);background:var(--surface2);color:var(--muted)}
.ovr.t5{background:var(--gold);color:#2a1d00}.ovr.t4{background:var(--accent);color:var(--accent-ink)}.ovr.t3{background:#1f6f52;color:#d6ffe9}.ovr.t2{background:#2a3d63;color:#cfe0ff}
.ovr.lg{min-width:56px;height:46px;font-size:30px;border-radius:12px}
.pos{display:inline-block;width:30px;text-align:center;font:700 12px/20px var(--f-disp);letter-spacing:.6px;border-radius:5px;border:1px solid}
.pos.GK{color:var(--amber);border-color:rgba(255,155,61,.5)}.pos.DF{color:var(--blue);border-color:rgba(77,141,255,.5)}.pos.MF{color:var(--accent);border-color:rgba(47,210,126,.5)}.pos.FW{color:var(--red);border-color:rgba(255,92,108,.5)}
.prow{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;min-height:56px}
.prow:last-child{border-bottom:0}
.prow:active{background:var(--surface2)}
.prow::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 2px 2px 0;background:transparent}
.prow.q-GK::before{background:var(--amber)}.prow.q-DF::before{background:var(--blue)}.prow.q-MF::before{background:var(--accent)}.prow.q-FW::before{background:var(--red)}
.prow .nm{font-weight:600;line-height:1.2;display:flex;align-items:center;gap:5px;min-width:0}
.prow .nm>.nmtext{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .badges{display:flex;gap:4px;flex-wrap:nowrap;flex:none}
.prow .sub{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:1px}
.prow .sub .clubtag{display:inline-flex;align-items:center;gap:4px;flex:none;color:var(--muted)}
.prow .sub .clubtag b{font:700 10.5px var(--f-disp);letter-spacing:.5px;text-transform:uppercase}
.prow .sub>.ell{min-width:0}
.statrow{gap:7px;padding:8px 10px;min-height:0}
.statrow>.pos{flex:none}
.statrow .statovr{min-width:30px;height:24px;font-size:14px;flex:none}
.statrow .sub{font-size:11px}
.statrow .statval{display:flex;align-items:baseline;gap:4px;justify-content:flex-end;min-width:34px;flex:none;font:700 22px/1 var(--f-disp)}
.statrow .statAux{font:600 12px var(--f-disp);color:var(--muted)}
.lscroll{max-height:280px;overflow-y:auto;overscroll-behavior:contain}
.card.flat.mscroll{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.prow .pos{flex:none}
.pright{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.pot{font:700 11px var(--f-disp);color:var(--accent);letter-spacing:.5px}
.mini{width:44px}
.inj{color:var(--red);font:700 11px var(--f-disp);letter-spacing:.5px}
.lh{display:flex;gap:10px;padding:6px 12px;font:600 11px var(--f-disp);letter-spacing:1px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}

/* league table */
.lt{display:grid;grid-template-columns:24px 1fr 26px 26px 26px 26px 34px 34px;align-items:center;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums;position:relative}
.lt.hd{font:600 11px var(--f-disp);letter-spacing:1px;color:var(--dim);text-transform:uppercase;padding-top:6px;padding-bottom:6px}
.lt.me{background:rgba(47,210,126,.1)}
.lt .tm{display:flex;align-items:center;gap:8px;min-width:0}
.lt b{font-family:var(--f-disp);font-size:16px}
.lt.z1::before,.lt.z2::before,.lt.z3::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px}
.lt.z1::before{background:var(--blue)}.lt.z2::before{background:var(--amber)}.lt.z3::before{background:var(--red)}
.fx{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:4px;padding:4px 10px;border-bottom:1px solid var(--line)}
.fx.me{background:rgba(47,210,126,.09)}
.fx .t{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600;font-size:12.5px}
.fx .t.r{justify-content:flex-end;text-align:right}
.fx .sc{font:700 13px var(--f-disp);text-align:center;background:var(--surface2);border-radius:6px;height:22px;min-height:0;display:flex;align-items:center;justify-content:center;letter-spacing:.4px}
.fx .sc.x{font-size:10px;color:var(--dim)}
.cal{display:grid;grid-template-columns:34px 72px 44px 1fr 40px;align-items:center;gap:5px;padding:4px 8px;border-bottom:1px solid var(--line)}
.cal:last-child{border-bottom:0}
.cal.cur{background:rgba(47,210,126,.08)}
.cal .wk{font:700 10px var(--f-disp);letter-spacing:.6px;color:var(--dim);text-transform:uppercase}
.cal .comp{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;padding:2px 7px}
.cal .opline{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.cal .oname{font-weight:600;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ha{justify-self:start;font-size:10px;padding:2px 7px}
.cal .res{text-align:right;font:700 13px var(--f-disp);white-space:nowrap}
.cal .res .rx{font-size:9px;letter-spacing:0;margin-left:2px;color:var(--dim)}
.cal .res.W{color:var(--accent)}.cal .res.L{color:var(--red)}.cal .res.D{color:var(--gold)}
.cal .ovr{justify-self:end}
.dot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font:700 11px var(--f-disp);color:#06101a}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .key{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.dot.W{background:var(--accent)}.dot.D{background:var(--gold)}.dot.L{background:var(--red)}

/* hero + pitch */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#102a3a,#0d1b30 60%);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow-2)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 38px,transparent 38px 76px);pointer-events:none}
.hero svg.lines{position:absolute;left:50%;top:50%;right:auto;width:270px;opacity:.06;transform:translate(-50%,-50%);pointer-events:none}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;position:relative;text-align:center}
.vs .tn{font:700 17px/1.1 var(--f-disp);text-transform:uppercase;margin:6px auto 0;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .at{font:800 22px var(--f-disp);color:var(--dim)}
.cmp{display:grid;grid-template-columns:34px 1fr 40px 1fr 34px;align-items:center;gap:8px;font:700 15px var(--f-disp);font-variant-numeric:tabular-nums;margin-top:10px;position:relative}
.cmp .l{text-align:center;font-size:10.5px;letter-spacing:1px;color:var(--dim)}
.cmp .b1,.cmp .b2{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;display:flex}
.cmp .b1{justify-content:flex-end}.cmp i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.cmp .b2 i{background:var(--blue)}
.pitch{position:relative;aspect-ratio:3/3.85;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(0deg,#15573a 0 12.5%,#186441 12.5% 25%);border:1px solid #2a7a55}
.pitchtools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:6}
.pbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(7,14,24,.74);border:1px solid rgba(255,255,255,.28);color:#e8eef8;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .12s,background .2s}
.pbtn:active{transform:scale(.9)}
.pbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.slotwrap{position:absolute;transform:translate(-50%,-50%);width:70px;animation:slotIn .52s cubic-bezier(.2,.9,.25,1.05) var(--d,0ms) backwards;transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1)}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;width:100%}
.slot .c{position:relative;width:42px;height:42px;border-radius:50%;background:#0b1626;border:2px solid #dfe8f5;display:grid;place-items:center;font:800 18px var(--f-disp);color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
.pbadge{position:absolute;top:-6px;left:-7px;min-width:19px;height:15px;padding:0 3px;border-radius:5px;display:grid;place-items:center;font:800 9px/1 var(--f-disp);letter-spacing:.3px;color:#06101a;border:1px solid rgba(0,0,0,.35);box-shadow:0 1px 2px rgba(0,0,0,.55)}
.pbadge.GK{background:var(--amber)}.pbadge.DF{background:var(--blue)}.pbadge.MF{background:var(--accent)}.pbadge.FW{background:var(--red)}
.pbadge.out{background:var(--amber);color:#2a1d00;box-shadow:0 0 0 2px rgba(255,155,61,.4)}
.ibadge{position:absolute;top:-6px;right:9px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:rgba(11,22,38,.94);border:1px solid #dfe8f5;box-shadow:0 1px 3px rgba(0,0,0,.5);padding:0;cursor:pointer}
.injb{position:absolute;top:25px;left:3px;display:flex;align-items:center;gap:2px;padding:1px 5px 1px 3px;border-radius:9px;background:var(--red);color:#fff;font:700 10px var(--f-disp);box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
.injb svg{width:13px;height:13px;stroke:#fff;fill:rgba(255,255,255,.25);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inj .injb{position:static;background:none;box-shadow:none;color:var(--red);padding:0}
.ibadge svg{width:12px;height:12px;stroke:#dfe8f5;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ibadge:active{transform:scale(.88)}
.slot .c.t5{background:var(--gold);color:#2a1d00;border-color:#fff}.slot .c.t4{background:var(--accent);color:var(--accent-ink)}
.slot .c.warn{border-color:var(--amber)}.slot .c.bad{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,92,108,.4)}
.slot .n{font:700 11px/1 var(--f-disp);letter-spacing:.3px;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;opacity:0;animation:nameIn .38s cubic-bezier(.2,.8,.2,1) calc(var(--d,0ms) + 80ms) forwards}
.fitbar{width:46px;height:5px;border-radius:3px;background:rgba(4,12,22,.6);border:1px solid rgba(255,255,255,.14);overflow:hidden;opacity:0;animation:nameIn .38s cubic-bezier(.2,.8,.2,1) calc(var(--d,0ms) + 120ms) forwards}
.fitbar>i{display:block;height:100%;border-radius:2px;background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.28),transparent)}
.fitbar.mid>i{background-color:var(--amber)}.fitbar.low>i{background-color:var(--red)}
@media (hover:hover){.slot:hover .c{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.5)}}
.slot:active .c{transform:scale(.9)}
@keyframes selPulse{0%,100%{box-shadow:0 0 0 3px var(--accent),0 0 0 0 rgba(47,210,126,.45)}50%{box-shadow:0 0 0 3px var(--accent),0 0 0 8px rgba(47,210,126,0)}}
.slot.sel .c{border-color:var(--accent);animation:selPulse 1.4s ease-in-out infinite}
.slotinner{position:relative;width:70px}
.benchgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:16px 4px;padding:8px 2px 2px}
.benchtoken{display:flex;justify-content:center;animation:nameIn .4s cubic-bezier(.2,.8,.2,1) var(--d,0ms) backwards}

/* sheet / overlays */
.sh-back{position:fixed;inset:0;background:rgba(2,6,12,.72);z-index:50;animation:fade .2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sh{position:fixed;inset:0;z-index:51;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.sh-p{pointer-events:auto;width:100%;max-width:560px;max-height:calc(100% - 40px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:#0c1729;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;animation:slideup .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -24px 64px -24px rgba(0,0,0,.85)}
.sh.out .sh-p{transform:translateY(100%);transition:transform .2s ease-in}
.sh.out+.x,.sh-back.out{opacity:0;transition:opacity .2s}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sh-h::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:3px;background:var(--line)}
.sh-h .t{font:700 20px var(--f-disp);text-transform:uppercase;letter-spacing:.5px;flex:1;min-width:0}
.sh-p{position:relative}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);font-size:20px;line-height:1;display:grid;place-items:center}
.sh-b{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;box-shadow:var(--sh-inset)}
.stat b{display:block;font:700 20px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:90;max-width:min(92vw,520px);background:#13233b;border:1px solid var(--line);border-left:3px solid var(--accent);color:var(--text);padding:11px 16px;border-radius:12px;font-weight:500;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:rise .3s}
.toast.bad{border-left-color:var(--red)}.toast.gold{border-left-color:var(--gold)}
.note{font-size:13px;color:var(--muted);line-height:1.4}
.flag{display:inline-block;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:1em;line-height:1;vertical-align:-1px;margin-right:2px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(47,210,126,.1);border:1px solid rgba(47,210,126,.35);font-size:13px}
.banner.w{background:rgba(255,155,61,.1);border-color:rgba(255,155,61,.4)}.banner.r{background:rgba(255,92,108,.1);border-color:rgba(255,92,108,.4)}
.news{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.news:last-child{border:0}
.news i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--dim)}
.news i.m{background:var(--accent)}.news i.t{background:var(--gold)}.news i.i{background:var(--red)}.news i.s{background:var(--blue)}

/* match centre */
.live{position:fixed;inset:0;z-index:60;background:var(--bg);background-image:radial-gradient(700px 300px at 50% -60px,rgba(47,210,126,.16),transparent 70%);display:flex;flex-direction:column;overflow:hidden;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(84px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .3s}
.live.ft{display:block;overflow-y:auto}
.live-in{max-width:560px;margin:0 auto;width:100%;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
#lvCv{flex:none}
.lvk{position:fixed;left:0;right:0;bottom:0;z-index:61;display:flex;justify-content:center;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(10,14,20,0),rgba(10,14,20,.85) 34%,var(--bg) 78%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lvk .grid3{width:100%;max-width:560px}
.lvk .btn{min-height:46px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.sb .tn{font:700 16px/1.1 var(--f-disp);text-transform:uppercase;margin-top:6px}
.sb .score{font:800 58px/1 var(--f-disp);letter-spacing:2px;font-variant-numeric:tabular-nums;min-width:120px}
.sb .score.gl{animation:goal .8s}
.clock{font:700 20px var(--f-disp);color:var(--accent);text-align:center;letter-spacing:1px}
.tl{position:relative;height:30px}
.tl .ln{position:absolute;left:0;right:0;top:14px;height:3px;background:var(--surface2);border-radius:2px}
.tl .pg{position:absolute;left:0;top:14px;height:3px;background:var(--accent);border-radius:2px;width:0}
.tl .ev{position:absolute;top:7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid var(--bg);animation:pop .4s backwards}
.tl .ev.h{background:var(--accent)}.tl .ev.a{background:var(--blue)}
.tl .mk{position:absolute;top:0;font-size:10px;color:var(--dim);transform:translateX(-50%)}
.feed{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:2px}
.fe{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);animation:feedin .35s;font-size:14px}
.fe .m{font:700 15px var(--f-disp);color:var(--muted);min-width:34px}
.fe.goal{border-color:rgba(242,193,78,.6);background:linear-gradient(90deg,rgba(242,193,78,.14),var(--surface))}
.fe.goal .m{color:var(--gold)}
.fe.sys{background:none;border-style:dashed;color:var(--muted)}
.sbar{display:grid;grid-template-columns:34px 1fr 90px 1fr 34px;gap:6px;align-items:center;font:700 15px var(--f-disp);font-variant-numeric:tabular-nums;padding:5px 0}
.sbar .n{font:600 11px var(--f-disp);letter-spacing:1px;text-transform:uppercase;color:var(--dim);text-align:center}
.ftteams{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 11px var(--f-disp);letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:0 0 2px;padding:0 1px}
.ftteams .ftt{display:flex;align-items:center;gap:6px;min-width:0;max-width:47%}
.ftteams .ftt.r{justify-content:flex-end;text-align:right}
.ftteams .ftt .ell{flex:1;min-width:0}
.ftteams .ftt .crest{flex:none}
.ftg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcol{min-width:0}
.gcol.a{text-align:right}
.gli{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0}
.gcol.a .gli{flex-direction:row-reverse}
.gli .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.gli .mm{font:700 12px var(--f-disp);color:var(--muted);flex:none}
.gass{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--dim);margin:-1px 0 8px;padding-left:20px}
.gcol.a .gass{flex-direction:row-reverse;justify-content:flex-start;padding-left:0;padding-right:20px}
.gi{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gli .gi{color:var(--gold)}
.gass .gi{color:var(--dim);width:12px;height:12px}
.ftrate{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ftrate .fh{display:flex;align-items:center;gap:5px;font:600 11px var(--f-disp);letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:0 2px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ftrate .fh .pill{font-size:9px;padding:0 6px;line-height:15px}
.ftrate .rr{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.05)}
.ftrate .rr:last-child{border-bottom:0}
.ftrate .rr .pos{width:26px;line-height:18px;font-size:11px;flex:none}
.ftrate .rr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftrate .rr b{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}
.ftrate .rr.motm,.ftrate .rr.motm .pos{color:var(--gold)}
.ftrate .rr.motm .pos{border-color:rgba(242,193,78,.6)}
.pat{display:flex;gap:5px}
.pat i{flex:1;height:7px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);transition:background .2s,border-color .2s}
.pat i.on{background:var(--accent);border-color:var(--accent)}
.lvk>.btn{width:100%;max-width:560px;min-height:52px;font-size:18px}
#lvFT{display:flex;flex-direction:column;gap:14px}
.fttabs .seg{gap:6px}

/* menu */
.menu{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:520px;margin:0 auto;padding:30px 0 30px;position:relative}
.rays{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.rays i{position:absolute;top:-10%;width:40vmax;height:120vmax;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 70%);transform-origin:50% 0;animation:beam 5s ease-in-out infinite}
.rays i:nth-child(1){left:-6%;transform:rotate(-22deg)}.rays i:nth-child(2){right:-6%;transform:rotate(22deg);animation-delay:1.6s}
.logo{font:800 60px/.92 var(--f-disp);text-transform:uppercase;letter-spacing:.5px}
.logo span{color:var(--accent);display:block}
.cc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:72px;transition:transform .12s,border-color .2s,box-shadow .2s;box-shadow:var(--shadow-1)}
.cc:active{transform:scale(.98);border-color:var(--accent)}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px}
.stars s{color:var(--line);text-decoration:none}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px}
.up{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.up:last-child{border:0}
.up .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center}
.up .ic svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lvl{display:flex;gap:3px;margin-top:5px}.lvl i{width:18px;height:5px;border-radius:3px;background:var(--surface2)}.lvl i.on{background:var(--accent)}.lvl i.bd{background:var(--gold);animation:beam 1.4s infinite}
.stadium{display:block;width:100%;height:auto}
/* start flow */
.wheelw{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:0 auto}
.wheelw svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
.ptr{position:absolute;left:50%;top:-6px;width:0;height:0;margin-left:-13px;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--gold);z-index:2;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .12s,border-color .2s,box-shadow .2s;box-shadow:var(--shadow-1)}
.opt:active{transform:scale(.98);border-color:var(--accent)}
.opt .ic{flex:none;width:52px;height:52px;border-radius:14px;background:var(--surface2);display:grid;place-items:center}
.opt .ic svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.zone{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.35);stroke-dasharray:4 4;cursor:pointer;transition:fill .15s}
.zone:hover{fill:rgba(47,210,126,.22)}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.ladder div{background:var(--surface2);border-radius:8px;padding:5px 0;font:700 14px var(--f-disp)}
.ladder div.on{background:var(--accent);color:var(--accent-ink)}
.ladder span{display:block;font:500 10px var(--f-body);opacity:.7}
.shbar{height:12px;border-radius:7px;background:var(--surface2);overflow:hidden;display:flex;box-shadow:var(--sh-inset)}
.shbar i{display:block;height:100%;border-radius:7px 0 0 7px;background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));transition:width .7s}
/* 2D match view */
.cv{width:100%;aspect-ratio:105/68;border-radius:14px;display:block;border:1px solid #2a7a55;background:#15573a}

  const tt=c=>table(divsOfCountry(c)[0]);

  CTRY.forEach((ct,c)=>{const T=tt(c);let k=0;for(let i=0;i<A.EL[c]&&k<T.length;i++){while(k<T.length&&used.has(T[k].i))k++;if(k<T.length)add('EL',T[k++].i)}});

  CTRY.forEach((ct,c)=>{const T=tt(c);let k=0;for(let i=0;i<A.ECL[c]&&k<T.length;i++){while(k<T.length&&used.has(T[k].i))k++;if(k<T.length)add('ECL',T[k++].i)}});
  const pool=S.clubs.map(c=>c.idx).filter(id=>!used.has(id)).sort((a,b)=>S.clubs[b].rep-S.clubs[a].rep);

/* Render: cambia solo lo que es distinto (no destruye todo el DOM en cada pulsación).
   - Cambio de pantalla/pestaña (render(true)): redibuja entero y empieza arriba.
   - Resto: compara con lo que hay en pantalla y actualiza solo las diferencias, así se conservan
     la posición de scroll, el foco, el efecto de pulsado y los contadores que no han cambiado. */
let _cuQ=[];
function morphAttrs(x,y){
  for(const at of Array.from(y.attributes))if(x.getAttribute(at.name)!==at.value)x.setAttributeNS(at.namespaceURI,at.name,at.value);
  for(const at of Array.from(x.attributes))if(!y.hasAttribute(at.name))x.removeAttribute(at.name);
}
function morphEl(x,y){
  if(x.hasAttribute('data-cu')&&y.hasAttribute('data-cu')){
    const same=x.dataset.cu===y.dataset.cu&&(x.dataset.f||'m')===(y.dataset.f||'m');
    morphAttrs(x,y);if(!same)_cuQ.push(x);return; /* contador sin cambios: no se toca ni se reanima */
  }
  morphAttrs(x,y);
  const tag=x.nodeName;
  if(tag==='INPUT'){
    if(document.activeElement!==x){if(x.value!==y.value)x.value=y.value}
    if(x.checked!==y.checked)x.checked=y.checked;return;
  }
  if(tag==='TEXTAREA'){if(document.activeElement!==x&&x.value!==y.value)x.value=y.value;return}
  if(tag==='SELECT'){morphKids(x,y);if(document.activeElement!==x&&x.value!==y.value)x.value=y.value;return}
  morphKids(x,y);
}
function morphKids(a,b){
  const bk=Array.from(b.childNodes);
  bk.forEach((y,i)=>{
    const x=a.childNodes[i];
    if(!x){a.appendChild(y);if(y.nodeType===1){if(y.hasAttribute('data-cu'))_cuQ.push(y);y.querySelectorAll('[data-cu]').forEach(e=>_cuQ.push(e))}return}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){
      a.replaceChild(y,x);if(y.nodeType===1){if(y.hasAttribute('data-cu'))_cuQ.push(y);y.querySelectorAll('[data-cu]').forEach(e=>_cuQ.push(e))}return}
    if(x.nodeType===1)morphEl(x,y);
    else if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;
  });
  while(a.childNodes.length>bk.length)a.removeChild(a.lastChild);
}

/* ---------- club offers ---------- */
const stakePrice=(o,s)=>Math.round(o.ask100*s/100/5)*5;
/* Tras un despido: tres clubes en los que se puede comprar al menos el 50% con la cartera que queda */
function makeSeekOffers(){
  const w=S.wallet,one=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;
  const all=S.clubs.filter(c=>c.idx!==S.seeking.from).map(c=>({i:c.idx,p:sharePrice(c)})).sort((a,b)=>b.p-a.p);
  const ok=all.filter(x=>x.p*1.12*.5<=w),th=Math.max(1,Math.floor(ok.length/3));
  let sel=[one(ok.slice(0,th)),one(ok.slice(th,2*th)),one(ok.slice(2*th))].filter(Boolean);
  sel=[...new Set(sel)];
  const rest=shuffle(ok.filter(x=>!sel.includes(x)));while(sel.length<3&&rest.length)sel.push(rest.pop());
  const cheap=[...all].reverse().filter(x=>!sel.includes(x));while(sel.length<3&&cheap.length)sel.push(cheap.shift());
  const offers=sel.sort((a,b)=>a.p-b.p).map(x=>({i:x.i,p:x.p,v:rf(.9,1.1),res:rf(.8,.92),tries:0,gone:false}));
  offers.forEach(o=>{o.ask100=Math.round(o.p*o.v/10)*10;if(stakePrice(o,50)>w)o.ask100=Math.max(10,Math.floor(w*.95*2/10)*10)});
  S.seekOffers=offers;return offers;
}
function makeOffers(){
  if(S.seeking)return makeSeekOffers();
  const w=S.wallet,all=S.clubs.map(c=>({i:c.idx,p:sharePrice(c)})).sort((a,b)=>a.p-b.p);
  const a100=all.filter(x=>x.p*1.08<=w),a50=all.filter(x=>!a100.includes(x)&&x.p*1.08*.5<=w),far=all.filter(x=>x.p*.5>w);
  const take=(arr,n)=>shuffle([...arr]).slice(0,n);
  const th=Math.floor(a100.length/3);
  let sel=[...take(a100.slice(2*th),2),...take(a100.slice(th,2*th),1),...take(a100.slice(0,th),1),...take(a50,2),...take(far.slice(0,8),1)];
  sel=[...new Set(sel)];
  if(sel.length<5)sel=[...sel,...take(all.filter(x=>!sel.includes(x)),5-sel.length)];
  const offers=sel.sort((a,b)=>a.p-b.p).map(x=>({i:x.i,p:x.p,v:rf(.9,1.1),res:rf(.8,.92),tries:0,gone:false}));
  offers.forEach(o=>{o.ask100=Math.round(o.p*o.v/10)*10});
  if(!offers.some(o=>stakePrice(o,50)<=w)){const c=offers[0];c.ask100=Math.max(10,Math.floor(w*.95*2/10)*10)}
  return offers;
}

function prow(p,o={}){
  const club=p.club>=0?S.clubs[p.club]:null,mine=p.club===S.me;
  const tail=`${p.age} yrs · ${natTag(p.nat)} · ${money(p.wage)}/yr · ${p.yrs}y`;
  const sub=o.clubTag
    ?`<span class="clubtag">${club?crest(club,15):''}<b>${club?esc(club.short):'Free agent'}</b></span><span class="ell">${tail}</span>`
    :o.club?`${club?esc(club.short):'Free agent'} · ${p.age} yrs · ${natTag(p.nat)}`:tail;
  const young=p.age<=23&&p.pot>p.ovr+2;
  const badges=[];

  if(p.listed)badges.push('<span class="pill y">listed</span>');

    `<div class="pright"><span class="ovr ${ovrC(p.ovr)}" title="Overall rating ${p.ovr}">${p.ovr}</span>${p.inj>0?`<span class="inj">${injTag(p)}</span>`:young?`<span class="pot" title="Potential ${p.pot}">↑${p.pot}</span>`:`<div class="mini"><div class="bar ${p.fit<60?'r':p.fit<80?'a':''}"><i style="width:${p.fit}%"></i></div></div>`}</div>`;
  return `<button class="prow q-${p.pos}" data-a="player" data-id="${p.id}"><span class="pos ${p.pos}">${esc(posLabel(p))}</span><div class="grow"><div class="nm"><span class="nmtext">${esc(p.n)}</span>${bad}</div><div class="sub${o.clubTag?'':' ell'}">${sub}</div></div>${right}</button>`;
}

function calRow(f,w){

   if(me.sq.length>=28){s.msg='Your squad is full (28 players).';s.bad=true;return drawSheet()}
   const r=respond(p,s.fee);
   if(r.r==='yes'){s.mode='contract';s.msg=null;s.msg2=`${S.clubs[p.club].name} accept ${money(s.fee)}. Now agree personal terms.`;s.demand=wageDemand(p);s.wage=s.demand;s.yrs=3;drawSheet(true)}
   else if(r.r==='counter'){s.msg=r.msg;s.bad=false;s.counter=r.need;drawSheet()}
   else{s.msg=r.msg;s.bad=true;s.counter=null;drawSheet()}},
 acceptcounter(){const s=ui.sheet,p=P(s.pid);s.fee=s.counter;if(s.fee>M().tb||s.fee>M().bal){s.msg='You cannot afford that.';s.bad=true;s.counter=null;return drawSheet()}
   s.mode='contract';s.msg=null;s.msg2=`${S.clubs[p.club].name} agree at ${money(s.fee)}. Now agree personal terms.`;s.demand=wageDemand(p);s.wage=s.demand;s.yrs=3;s.counter=null;drawSheet(true)},
 sign(){const s=ui.sheet,p=P(s.pid),me=M(),renew=s.mode==='renew';
   if(!renew&&S.embargo){s.msg='Transfer embargo: the bank blocks all signings.';return drawSheet()}
   if(!renew&&me.sq.length>=28){s.msg='Your squad is full (28 players).';return drawSheet()}
   const bill=wageBill(me)-(renew?p.wage:0)+s.wage;if(bill>me.wb){s.msg=`That breaks your wage budget (${money(me.wb)}).`;return drawSheet()}
   if(s.wage<s.demand*.95){s.msg=`${sname(p)} wants at least ${money(Math.round(s.demand*.95/1e4)*1e4)} a year.`;return drawSheet()}
   if(renew){p.wage=s.wage;p.yrs=Math.min(6,p.yrs+s.yrs);toast(`${sname(p)} signs until ${S.season+Math.min(6,p.yrs)-1}.`,'gold')}
   else{if((s.fee||0)>me.tb||(s.fee||0)>me.bal){s.msg='You can no longer afford the fee.';return drawSheet()}transferIn(p,s.fee||0,s.wage,s.yrs);toast(`${sname(p)} joins ${me.short}!`,'gold')}
   closeSheet();render();touch()},
 acc(d){const o=S.offers.find(x=>x.id===+d.id);if(!o)return;const p=P(o.pid),b=sellBlock(p);if(b)return toast(b,'bad');sellPlayer(o,o.fee);toast(`${sname(p)} sold for ${money(o.fee)}.`,'gold');render();touch()},
 rej(d){S.offers=S.offers.filter(x=>x.id!==+d.id);render();touch()},
 nego(d){if(!windowOpen())return toast('The transfer window is closed.','bad');const o=S.offers.find(x=>x.id===+d.id);if(!o)return;const p=P(o.pid);offerMeta(o,p);ui.sheet={kind:'nego',id:o.id,ask:o.fee,msg:o.msg||'',bad:!!o.mood,dead:!!o.dead};drawSheet(true)},
 ngsend(){if(!windowOpen())return toast('The transfer window is closed.','bad');const s=ui.sheet;if(!s||s.kind!=='nego')return;const o=S.offers.find(x=>x.id===s.id);if(!o)return;const p=P(o.pid);offerMeta(o,p);
   const ask=Math.max(o.fee,s.ask||o.fee);
   if(ask<=o.max){sellPlayer(o,ask);closeSheet();toast(`Deal agreed: ${sname(p)} sold for ${money(ask)}.`,'gold');render();touch();return}
   o.pat=(o.pat||1)-1;
   if(o.pat<=0){S.offers=S.offers.filter(x=>x.id!==o.id);o.dead=1;o.mood=1;o.msg=`${S.clubs[o.from].short} lose patience and walk away from the deal.`;s.dead=1;s.bad=1;s.msg=o.msg;render();drawSheet();touch();return}
   const step=Math.max(5e4,Math.round((o.max-o.fee)*.5/5e4)*5e4);o.fee=Math.min(o.max,o.fee+step);
   o.msg=`"${money(ask)} is too much for us. We can go up to ${money(o.fee)}."`;o.mood=0;s.ask=o.fee;s.msg=o.msg;s.bad=0;s.dead=0;drawSheet();render();touch()},
 ngaccept(){if(!windowOpen())return toast('The transfer window is closed.','bad');const s=ui.sheet;if(!s||s.kind!=='nego')return;const o=S.offers.find(x=>x.id===s.id);if(!o||o.dead)return;const p=P(o.pid),b=sellBlock(p);if(b)return toast(b,'bad');const fee=o.fee;sellPlayer(o,fee);closeSheet();toast(`Deal agreed: ${sname(p)} sold for ${money(fee)}.`,'gold');render();touch()},
 ngrej(){const s=ui.sheet;if(!s||s.kind!=='nego')return;S.offers=S.offers.filter(x=>x.id!==s.id);closeSheet();render();touch()},
 /* club */
 spons(d){if(S.week!==0)return;const o=S.spons.offers[+d.i],me=M();if(S.spons.cur.name===o.name)return;S.spons.cur={...o};if(o.bonus){me.bal+=o.bonus;me.fin.s.sponsor+=o.bonus}toast(`${o.name} are your new main sponsor.`,'gold');render();touch()},
 upg(d){const me=M(),k=d.k,l=me.up[k],cost=upCost(k,l,me);if(me.bal<cost||me.build.some(b=>b.k===k)||l>=UPG[k].max)return;
   me.bal-=cost;me.fin.s.build+=cost;me.build.push({k,wk:UPG[k].wk});nn(`Construction started: ${UPG[k].n} (${money(cost)}).`,'s');toast(`${UPG[k].n} upgrade started`,'gold');render();touch()},
 exp(){packCode(serialize()).then(t=>{ui.txt=t;render();const e=$('#sv');if(e){e.focus();e.select()}toast('Game code ready. Tap Copy.','')})},
 copy(){const el=$('#sv');if(!ui.txt){H.exp();return}el.select();const done=()=>toast('Game code copied');try{navigator.clipboard.writeText(ui.txt).then(done,()=>{el.select();toast('Press copy on the selected text','gold')})}catch(e){el.select();toast('Press copy on the selected text','gold')}},
 imp(){if(!String(ui.txt||'').trim()){toast('Paste a saved game first.','bad');return}importText(ui.txt)},
 dlsave(){downloadSave()},
 impfile(){pickFile()},
 quit(){ask('Leave club','Start a new game? Your autosave stays until you take charge of another club.','Leave',()=>{ui.screen='menu';ui.tab='home';render(true);scrollTo(0,0)})}
};
const IN={
 dealo(el){const s=ui.sheet,o=ui.offers[s.k],askS=stakePrice(o,s.stake);s.offer=+el.value;s.counter=null;s.msg=null;$('#dlV').textContent=eur(s.offer);const hh=hintDeal(o,askS,s.offer),e=$('#dlH');e.textContent=hh[0];e.className='note '+hh[1];$('#dlL').textContent=`You would keep ${eur(S.wallet-s.offer)}.`},
 negoask(el){const s=ui.sheet;if(!s||s.kind!=='nego')return;const o=S.offers.find(x=>x.id===s.id);if(!o)return;s.ask=+el.value;const d=s.ask-o.fee;const v=$('#ngV');if(v)v.textContent=money(s.ask);const l=$('#ngL');if(l)l.textContent=d>0?`${money(d)} above their current bid`:'Matching their current bid'},
  mgr(el){ui.mgr=el.value},
  txt(el){ui.txt=el.value},
 mq(el){ui.mf.q=el.value;ui.mf.page=1;const l=$('#mlist');if(l)l.innerHTML=mlist();fitMktList()},
 fee(el){const s=ui.sheet,p=P(s.pid);s.fee=+el.value;s.counter=null;s.msg=null;$('#feeV').textContent=money(s.fee);const h=feeHint(p,s.fee),e=$('#feeH');e.textContent=h[0];e.className='note '+h[1]},
 wage(el){const s=ui.sheet,me=M();s.wage=+el.value;$('#wgV').textContent=money(s.wage);const renew=s.mode==='renew';$('#wgS').textContent=`Wage bill after signing: ${money(wageBill(me)-(renew?P(s.pid).wage:0)+s.wage)} of ${money(me.wb)} budget`},
 yrs(el){ui.sheet.yrs=+el.value},
 price(el){const me=M();me.price=+el.value;const pos=S.week>0?myPos():10,cap=capacity(me),fr=fillRate(me,me.price,pos),att=Math.round(cap*fr);
   $('#prv').textContent='€'+me.price;$('#pra').textContent=num(att);$('#prf').textContent=Math.round(fr*100)+'%';$('#prr').textContent=money(att*(me.price+2.5+me.up.comm*1.2));clearTimeout(IN.pt);IN.pt=setTimeout(touch,500)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=H[el.dataset.a];if(!f)return;e.preventDefault();if(el.closest('.nav-extra')&&el.dataset.a!=='navtoggle'){ui.navOpen=false;const n=document.querySelector('.nav');if(n)n.classList.remove('open');const b=document.querySelector('.nav-back');if(b)b.classList.remove('on')}f(el.dataset,el)});
window.addEventListener('resize',()=>{if(ui.screen==='game'&&ui.tab==='market')fitMktList()});
if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(ui.screen==='game'&&ui.tab==='market')fitMktList()});
(function(){
  let sy=null,active=false;
  document.addEventListener('touchstart',e=>{if(e.target&&e.target.closest&&e.target.closest('.nav')){active=true;sy=e.touches[0].clientY}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!active)return;},{passive:true});
  document.addEventListener('touchend',e=>{if(!active)return;active=false;const dy=e.changedTouches[0].clientY-sy;sy=null;if(dy<-30&&!ui.navOpen)H.navtoggle();else if(dy>30&&ui.navOpen)H.navtoggle();},{passive:true});
})();
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(!el)return;const f=IN[el.dataset.in];if(f)f(el)});
(function(){const f=document.createElement('input');f.type='file';f.id='impf';f.accept='.json,.txt,application/json,text/plain';f.hidden=true;f.addEventListener('change',()=>importFile(f.files&&f.files[0]));document.body.appendChild(f)})();
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.sel){ui.mf[el.dataset.sel]=el.value;ui.mf.lim=40;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.sheet)closeSheet()}});
ui.wk=0;
render(true);
</script>
